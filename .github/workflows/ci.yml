name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Caches ~/.cache/uv, keyed on the lock. The heavy part of a cold run
          # is the download — tls-client alone is 93MB, via python-jobspy — and
          # rebuilding .venv from a warm cache costs ~0.1s, so there is nothing
          # to gain from caching the virtualenv itself.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Without this uv fetches and unpacks CPython on every run: its
          # managed interpreters live in ~/.local/share/uv/python, which is not
          # part of the uv cache directory. The action caches them properly.
          python-version: "3.13"

      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/ -q

      # The gates read their thresholds and blocklists from profiles.json, so a
      # malformed edit there breaks ranking at runtime rather than at import.
      # The user's own profile is gitignored — it carries a salary and target
      # titles — so there is none to load here. What CI can check is what the
      # repository actually ships: the shared template, and that the setup
      # wizard's builder turns answers into a config the ranker accepts.
      - name: Shipped config is usable
        run: |
          uv run python - <<'PY'
          import json, tempfile, pathlib
          from autowork import profile_build, rank
          # build() saves each resume's text next to the profile. Redirect it:
          # a check should not leave files in the working tree.
          profile_build.RESUME_DIR = pathlib.Path(tempfile.mkdtemp())
          template = json.loads(profile_build.TEMPLATE.read_text())
          assert template["role_families"], "template lost its role families"
          assert template["constraints"]["block_role_terms"], "template lost its gates"

          built = profile_build.build({
              "name": "CI", "city": "Bengaluru, India", "years": 1.5,
              "experience_band": "0-2", "families": ["engineering"],
              "resumes": [{"slug": "main", "label": "CV", "path": "cv.md",
                           "roles": ["Software Engineer"], "skills": ["Python"],
                           "key_skills": ["Python"], "text": "python"}],
          })
          problems = [p for p in profile_build.validate(built)
                      if "resume file" not in p]   # no files in a CI checkout
          assert not problems, problems
          rank.location_tier("Bengaluru, India", False, built)
          print(f"template ok; generated config has "
                f"{len(built['profiles'])} profile(s)")
          PY
