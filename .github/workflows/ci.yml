name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Caches ~/.cache/uv, keyed on the lock. The heavy part of a cold run
          # is the download — tls-client alone is 93MB, via python-jobspy — and
          # rebuilding .venv from a warm cache costs ~0.1s, so there is nothing
          # to gain from caching the virtualenv itself.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Without this uv fetches and unpacks CPython on every run: its
          # managed interpreters live in ~/.local/share/uv/python, which is not
          # part of the uv cache directory. The action caches them properly.
          python-version: "3.13"

      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/ -q

      # The gates read their thresholds and blocklists from profiles.json, so a
      # malformed edit there breaks ranking at runtime rather than at import.
      - name: Config parses
        run: uv run python -c "from autowork import rank; rank.load_config()"
