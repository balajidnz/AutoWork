[project]
name = "autowork"
version = "0.1.0"
description = "Daily job sourcing and ranking from company ATS boards and free job APIs"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "openpyxl>=3.1",
    "python-jobspy>=1.1.80",
    "fpdf2>=2.8",
    "pypdf>=6.15.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
autowork = "autowork.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autowork"]

# The console is a single HTML file plus the shared profile template; both are
# read at runtime, so they have to travel with the package.
[tool.hatch.build.targets.wheel.force-include]
"autowork/web" = "autowork/web"
